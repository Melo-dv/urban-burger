<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Lojista | Urban Burger</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #121212;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .admin-container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ff9800;
            padding-bottom: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .admin-header h1 {
            color: #ff9800;
            margin: 0;
            font-size: 24px;
        }
        .painel-controles {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .input-data {
            background-color: #1e1e1e;
            color: #fff;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-acao {
            background-color: #ff9800;
            color: #000;
            border: none;
            padding: 10px 16px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-acao:hover {
            background-color: #e68900;
        }
        .btn-apagar {
            background-color: #d32f2f;
            color: #fff;
        }
        .btn-apagar:hover {
            background-color: #b71c1c;
        }
        .grid-pedidos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .cartao-pedido-admin {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .cartao-pedido-admin h3 {
            margin-top: 0;
            color: #ff9800;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        .cartao-pedido-admin p {
            margin: 6px 0;
            font-size: 14px;
            color: #ccc;
        }
        .cartao-pedido-admin strong {
            color: #fff;
        }
        .itens-lista {
            background: #2a2a2a;
            padding: 8px;
            border-radius: 4px;
            margin: 10px 0;
            font-size: 13px;
        }
        .total-pedido {
            font-size: 16px;
            font-weight: bold;
            color: #25D366;
            margin-top: 10px;
        }
        .sem-pedidos {
            text-align: center;
            color: #777;
            grid-column: 1 / -1;
            font-size: 18px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <div class="admin-header">
            <h1>🍔 Painel de Pedidos - Lojista</h1>
            
            <div class="painel-controles">
                <label for="filtroData" style="font-size: 14px; color: #ccc;">Data:</label>
                <input type="date" id="filtroData" class="input-data">
                <button class="btn-acao" id="btnFiltrar">Ver Pedidos</button>
                <button class="btn-acao btn-apagar" id="btnApagarDia">Apagar Dia</button>
            </div>
        </div>

        <div id="listaPedidosAdmin" class="grid-pedidos">
            <p class="sem-pedidos">Selecione uma data para carregar os pedidos.</p>
        </div>
    </div>

    <!-- Script de Conexão e Lógica do Admin -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyApX3wZRaf0P2J2W7ZXMuHxfcS3nVqv2qA",
          authDomain: "urban-burger-delivery.firebaseapp.com",
          projectId: "urban-burger-delivery",
          storageBucket: "urban-burger-delivery.firebasestorage.app",
          messagingSenderId: "603754288588",
          appId: "1:603754288588:web:73beb98886ce08e2897969",
          measurementId: "G-WTGKXX2FWT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Define a data atual como padrão no input ao abrir a página
        const inputData = document.getElementById('filtroData');
        const hoje = new Date().toISOString().split('T')[0];
        inputData.value = hoje;

        async function carregarPedidosPorData() {
            const dataSelecionada = inputData.value; // Formato: YYYY-MM-DD
            const container = document.getElementById('listaPedidosAdmin');
            
            if (!dataSelecionada) {
                alert('Por favor, selecione uma data.');
                return;
            }

            container.innerHTML = '<p class="sem-pedidos">Buscando pedidos do dia...</p>';

            try {
                // Converte a data selecionada (AAAA-MM-DD) para o formato salvo no banco (DD/MM/AAAA)
                const partes = dataSelecionada.split('-');
                const dataFormatadaBusca = `${partes[2]}/${partes[1]}/${partes[0]}`;

                // Faz a consulta no Firestore filtrando pela data formatada
                const q = query(collection(db, "pedidos"), where("dataFormatada", ">=", dataFormatadaBusca));
                const querySnapshot = await getDocs(q);

                container.innerHTML = '';
                let contador = 0;

                querySnapshot.forEach((docSnap) => {
                    const pedido = docSnap.data();
                    
                    // Garante que pega apenas os pedidos exatamente do dia escolhido
                    if (pedido.dataFormatada && pedido.dataFormatada.startsWith(dataFormatadaBusca)) {
                        contador++;
                        let itensHtml = '';
                        if (pedido.itens && Array.isArray(pedido.itens)) {
                            pedido.itens.forEach(item => {
                                const extraTxt = item.extras ? ` (${item.extras})` : '';
                                itensHtml += `• ${item.quantidade}x ${item.nome}${extraTxt}<br>`;
                            });
                        }

                        const div = document.createElement('div');
                        div.className = 'cartao-pedido-admin';
                        div.innerHTML = `
                            <h3>Pedido #${pedido.id || '---'} <span>🔥</span></h3>
                            <p><strong>Cliente:</strong> ${pedido.nomeCliente || 'Não informado'}</p>
                            <p><strong>Telefone:</strong> ${pedido.telefone || 'Não informado'}</p>
                            <p><strong>Endereço:</strong> ${pedido.endereco || 'Não informado'}</p>
                            <div class="itens-lista">
                                <strong>Itens:</strong><br>
                                ${itensHtml}
                            </div>
                            <p><strong>Pagamento:</strong> ${pedido.pagamento || 'Não informado'}</p>
                            <p><strong>Observação:</strong> ${pedido.observacao || 'Nenhuma'}</p>
                            <p><strong>Horário:</strong> ${pedido.dataFormatada}</p>
                            <div class="total-pedido">Total: R$ ${pedido.total ? pedido.total.toFixed(2).replace('.', ',') : '0,00'}</div>
                        `;
                        container.appendChild(div);
                    }
                });

                if (contador === 0) {
                    container.innerHTML = `<p class="sem-pedidos">Nenhum pedido encontrado para o dia ${dataFormatadaBusca}.</p>`;
                }

            } catch (erro) {
                console.error("Erro ao carregar pedidos:", erro);
                container.innerHTML = '<p class="sem-pedidos" style="color: #ff4444;">Erro ao carregar os pedidos do banco de dados.</p>';
            }
        }

        // Função para apagar todos os pedidos do dia selecionado
        async function apagarPedidosDoDia() {
            const dataSelecionada = inputData.value;
            const partes = dataSelecionada.split('-');
            const dataFormatadaBusca = `${partes[2]}/${partes[1]}/${partes[0]}`;

            const confirmar = confirm(`Tem certeza que deseja apagar todos os pedidos do dia ${dataFormatadaBusca}? Esta ação não pode ser desfeita.`);
            if (!confirmar) return;

            try {
                const q = query(collection(db, "pedidos"));
                const querySnapshot = await getDocs(q);

                let promessasExclusao = [];
                querySnapshot.forEach((docSnap) => {
                    const pedido = docSnap.data();
                    if (pedido.dataFormatada && pedido.dataFormatada.startsWith(dataFormatadaBusca)) {
                        const refDoc = doc(db, "pedidos", docSnap.id);
                        promessasExclusao.push(deleteDoc(refDoc));
                    }
                });

                await Promise.all(promessasExclusao);
                alert(`Todos os pedidos do dia ${dataFormatadaBusca} foram apagados com sucesso!`);
                carregarPedidosPorData();

            } catch (erro) {
                console.error("Erro ao apagar pedidos:", erro);
                alert("Erro ao tentar apagar os pedidos.");
            }
        }

        // Eventos dos botões
        document.getElementById('btnFiltrar').addEventListener('click', carregarPedidosPorData);
        document.getElementById('btnApagarDia').addEventListener('click', apagarPedidosDoDia);

        // Carrega automaticamente os pedidos do dia atual ao abrir a página
        document.addEventListener('DOMContentLoaded', carregarPedidosPorData);
    </script>
</body>
</html>
